<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Mahasiswa D3</title>
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<script src="script-fetch.js"></script>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow p-4">
      <h2 class="mb-4 text-center">Form Mahasiswa D3</h2>
      <form id="form">
        <div class="mb-3">
          <label for="nama" class="form-label">Nama</label>
          <input type="text" class="form-control" id="nama" name="nama" placeholder="Masukkan nama" required>
        </div>
        <div class="mb-3">
          <label for="prodi" class="form-label">Prodi</label>
          <input type="text" class="form-control" id="prodi" name="prodi" placeholder="Masukkan prodi" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Kirim</button>
      </form>
      <div id="response" class="mt-3 text-success fw-bold text-center"></div>
    </div>
  </div>


  <!-- ✅ Versi jQuery -->
  <!-- <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script-jquery.js"></script> -->

  <!-- ✅ Versi Fetch -->
  <script src="script-fetch.js"></script>
</body>
</html>
